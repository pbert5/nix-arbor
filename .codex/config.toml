# Project-local Codex settings. Authentication and personal preferences belong
# in the user's CODEX_HOME, not in this repository.
# AGENTS.md is the policy source; `nix develop` is the canonical environment.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[agents]
max_concurrent_threads_per_session = 6

# Repository-local MCP defaults. Keep credentials in the user's environment or
# Codex's OAuth store; never commit tokens here.

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp"]
enabled = true
startup_timeout_sec = 20

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = true
startup_timeout_sec = 20

# Narrow CI/local discrepancy escalation; see AGENTS.md.
[agents.ci-discrepancy-consultant]
description = "Read-only GPT-6.1 Sol consultant for unexplained CI/local test discrepancies."
config_file = "./agents/ci-discrepancy-consultant.toml"

# Project-local Codex settings. Authentication, approval, sandbox, model, and
# personal preferences belong in the user's CODEX_HOME, not in this repository.
# AGENTS.md is the policy source; `nix develop` is the canonical environment.

[agents]
# Do not turn this project file into a fixed topology or consume the nested
# delegation reserve. The primary executor observes the live runtime cap and
# reserves capacity before an owner delegates depth-2 specialists.
enabled = true

[agents.nix-specialist]
description = "Read-only Nix flake and module semantics specialist."
config_file = "./agents/nix-specialist.toml"

[agents.integration-test]
description = "Read-only workflow and validation agent covering success and safety paths."
config_file = "./agents/integration-test.toml"

# Repository-local MCP defaults. Keep credentials in the user's environment or
# Codex's OAuth store; never commit tokens here.

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp"]
enabled = true
startup_timeout_sec = 20

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = true
startup_timeout_sec = 20

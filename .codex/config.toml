# Project-local Codex settings. Authentication and personal preferences belong
# in the user's CODEX_HOME, not in this repository.
# AGENTS.md is the policy source; `nix develop` is the canonical environment.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[agents]
max_concurrent_threads_per_session = 6

# Opt-in only: select these variants when the current session explicitly requests high-burn.
[agents.architect-researcher-terra-high]
description = "High-burn opt-in architect-researcher; preserve the normal role's task boundaries."
config_file = "./agents/architect-researcher-terra-high.toml"

[agents.implementer-terra-high]
description = "High-burn opt-in implementer; preserve the normal role's task boundaries."
config_file = "./agents/implementer-terra-high.toml"

[agents.reviewer-terra-high]
description = "High-burn opt-in reviewer; preserve the normal role's task boundaries."
config_file = "./agents/reviewer-terra-high.toml"

[agents.integration-test-terra-high]
description = "High-burn opt-in integration-test; preserve the normal role's task boundaries."
config_file = "./agents/integration-test-terra-high.toml"

[agents.nix-specialist-terra-high]
description = "High-burn opt-in nix-specialist; preserve the normal role's task boundaries."
config_file = "./agents/nix-specialist-terra-high.toml"

# Repository-local MCP defaults. Keep credentials in the user's environment or
# Codex's OAuth store; never commit tokens here.

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp"]
enabled = true
startup_timeout_sec = 20

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = true
startup_timeout_sec = 20
